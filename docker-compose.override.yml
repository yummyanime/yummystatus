services:
    db:
        restart: "no"
        healthcheck:
            interval: 3s
        ports: !override
            - "127.0.0.1:15432:5432"

    api:
        image: yummystatus-dev-api
        build:
            context: .
            dockerfile: api/Dockerfile
            target: dev
        restart: "no"
        ports:
            - "127.0.0.1:13000:3000"
        volumes:
            - ./api:/app/api
            - ./db:/app/db
            - ./domains.ts:/app/domains.ts
            - /app/api/node_modules
            - /app/db/node_modules
        healthcheck:
            interval: 3s
            retries: 20

    collector:
        image: yummystatus-dev-collector
        build:
            context: .
            dockerfile: collector/Dockerfile
            target: dev
        restart: "no"
        volumes:
            - ./collector:/app/collector
            - ./db:/app/db
            - ./domains.ts:/app/domains.ts
            - /app/collector/node_modules
            - /app/db/node_modules

    site:
        image: yummystatus-dev-site
        build:
            context: .
            dockerfile: site/Dockerfile
            target: dev
        restart: "no"
        environment:
            - API_URL=http://api:3000
        ports:
            - "127.0.0.1:15173:5173"
        volumes:
            - ./site:/app/site
            - ./domains.ts:/app/domains.ts
            - /app/site/node_modules
        depends_on:
            api:
                condition: service_healthy

    bot:
        profiles: [prod]

    caddy:
        profiles: [prod]
