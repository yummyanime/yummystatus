name: CI/CD Docker

on:
    push:
        branches:
            - master

env:
    REGISTRY: ghcr.io

jobs:
    build-and-push:
        runs-on: ubuntu-latest
        permissions:
            contents: read
            packages: write
        strategy:
            fail-fast: true
            matrix:
                service: [api, collector, bot, site]
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Lowercase repository
              run: echo "REPO=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

            - name: Set up Buildx
              uses: docker/setup-buildx-action@v3

            - name: Login to GHCR
              uses: docker/login-action@v3
              with:
                  registry: ${{ env.REGISTRY }}
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Build and push
              uses: docker/build-push-action@v6
              with:
                  context: .
                  file: ${{ matrix.service }}/Dockerfile
                  push: true
                  tags: |
                      ${{ env.REGISTRY }}/${{ env.REPO }}-${{ matrix.service }}:latest
                      ${{ env.REGISTRY }}/${{ env.REPO }}-${{ matrix.service }}:${{ github.sha }}
                  cache-from: type=gha,scope=${{ matrix.service }}
                  cache-to: type=gha,mode=max,scope=${{ matrix.service }}

    deploy:
        needs: build-and-push
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Copy files to server
              uses: appleboy/scp-action@master
              with:
                  host: ${{ secrets.HOST }}
                  username: root
                  port: 22
                  key: ${{ secrets.SSH_PRIVATE_KEY }}
                  source: "docker-compose.yml,caddy/Caddyfile"
                  target: "/root/yummystatus/"

            - name: Deploy to server
              uses: appleboy/ssh-action@master
              with:
                  host: ${{ secrets.HOST }}
                  username: root
                  key: ${{ secrets.SSH_PRIVATE_KEY }}
                  port: 22
                  script: |
                      set -euo pipefail

                      if ! command -v docker >/dev/null 2>&1; then
                        echo "Docker not found, installing via get.docker.com"
                        curl -fsSL https://get.docker.com | sh
                        systemctl enable --now docker
                      fi

                      mkdir -p /root/yummystatus
                      cd /root/yummystatus

                      umask 077
                      cat > .env <<ENVEOF
                      GITHUB_REPOSITORY=$(echo '${{ github.repository }}' | tr 'A-Z' 'a-z')
                      TAG=${{ github.sha }}
                      DB_USER=${{ secrets.DB_USER }}
                      DB_PASSWORD=${{ secrets.DB_PASSWORD }}
                      GLOBALPING_API_KEY=${{ secrets.GLOBALPING_API_KEY }}
                      GLOBALPING_API_KEY2=${{ secrets.GLOBALPING_API_KEY2 }}
                      GLOBALPING_API_KEY3=${{ secrets.GLOBALPING_API_KEY3 }}
                      GLOBALPING_API_KEY4=${{ secrets.GLOBALPING_API_KEY4 }}
                      GLOBALPING_API_KEY5=${{ secrets.GLOBALPING_API_KEY5 }}
                      GLOBALPING_API_KEY6=${{ secrets.GLOBALPING_API_KEY6 }}
                      GLOBALPING_SECRET_KEY=${{ secrets.GLOBALPING_SECRET_KEY }}
                      PSI_API_KEY=${{ secrets.PSI_API_KEY }}
                      TG_BOT_TOKEN=${{ secrets.TG_BOT_TOKEN }}
                      TG_CHAT_ID=${{ secrets.TG_CHAT_ID }}
                      ENVEOF
                      chmod 600 .env

                      echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

                      docker compose pull
                      if ! docker compose up -d --remove-orphans; then
                        docker compose ps -a
                        docker compose logs --tail=100
                        exit 1
                      fi
                      docker compose exec -T caddy caddy reload --config /etc/caddy/Caddyfile --adapter caddyfile || docker compose restart caddy

                      docker image prune -af
